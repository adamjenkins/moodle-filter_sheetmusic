name: filter_sheetmusic
summary: 'A Moodle text filter that engraves sheet music stored as ABC notation wherever Moodle displays text, with optional in-browser playback.'
description: |
  Turns scores stored as `<pre class="sheetmusic sheetmusic-abc">` blocks
  into engraved notation in pages, books, forum posts, assignment descriptions,
  quiz questions and glossary entries. With the filter switched off the ABC
  source stays readable on the page, so content survives the plugin. Requires
  local_sheetmusic, which does the rendering and playback; for music teachers
  who want notation inside ordinary Moodle content.
labels:
